      sizes="32x32"
    />
    <title>ESCode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "escode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-escode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const finalTheme = resolved === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-escode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-escode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--escode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--escode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-escode-bootstrap-theme="light"] body {
        background: var(--escode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--escode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-escode-browser-theme-surface],
      html[data-escode-browser-theme-surface] body,
      html[data-escode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--escode-bootstrap-bg, #161616)) !important;
      }

      html[data-escode-browser-theme-surface="light"],
      html[data-escode-browser-theme-surface="light"] body,
      html[data-escode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--escode-bootstrap-bg, #f8f8f8)) !important;
      }

      .escode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--escode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--escode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-escode-bootstrap-theme="light"] .escode-boot-loading {
        background: var(--escode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--escode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .escode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .escode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .escode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。-->
      <div
        class="escode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="escode-boot-loading__logo-shell">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="118px"
            height="100px"
            fill="none"
            viewBox="0 0 256 218"
            class="escode-boot-loading__logo"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M134.4 0.130152L116.48 25.6022C113.665 29.5699 109.054 32.0019 104.064 32.0019H6.3999V0C6.3999 0.130149 134.4 0.130152 134.4 0.130152Z"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <path fill="currentColor" d="M256 0.130127L102.401 217.732H0L153.599 0.130127H256Z">
              <animate
                attributeName="opacity"
                begin="0.75s"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
            <path
              fill="currentColor"
              d="M121.601 217.732L139.65 192.134C142.465 188.166 147.076 185.734 152.067 185.734H249.604V217.736H121.601V217.732Z"
            >
              <animate
                attributeName="opacity"
                dur="1.5s"
                repeatCount="indefinite"
                values="1;0.3;1"
              />
            </path>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
