# 临时：在 macOS 上单独复现工作流恢复用例的挂起（定位后删除）。
name: rust-focus

on:
  push:
    branches: ["feat/**"]
    paths:
      - .github/workflows/rust-focus.yml
      - packages/services/tests/zcode-cli-rust-workflow-resume.test.ts
      - apps/zcode-cli-rust/crates/**
      - apps/zcode-cli/packages/cli/src/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  ZCODE_TEST_SERIAL: "1"

jobs:
  resume:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/zcode-cli-rust
      - run: pnpm install --frozen-lockfile
      - run: node apps/zcode-cli/packages/dynamic-workflow/scripts/generate-libs.mjs
      - run: pnpm --dir apps/zcode-cli --filter "@zcode/bootstrap^..." build
      - run: node scripts/build-desktop-agent-cli.mjs
      - run: cargo build --locked --manifest-path apps/zcode-cli-rust/Cargo.toml
      - name: resume test (3 attempts)
        shell: bash
        env:
          TSX_TSCONFIG_PATH: packages/services/tests/tsconfig.zcode-cli-rust.json
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i"
            node --import tsx --test --test-timeout=300000 packages/services/tests/zcode-cli-rust-workflow-resume.test.ts || true
          done
