# 桌面端跨平台 E2E 矩阵（阶段 3 验收）
#
# 目的：回答「GUI 是否真的在各平台可用」，与 installed 作业（安装包启动/切换演练）区分。
# 用例清单与判定口径见 docs/testing/desktop-e2e-ci-matrix.md。
name: desktop e2e matrix

on:
  push:
    branches: [main, dev]
  # PR 门禁：只在与桌面端、E2E 或本 workflow 相关的改动上运行，避免每个 PR 都跑重矩阵。
  pull_request:
    paths:
      - "packages/desktop/**"
      - "packages/ui/**"
      # Host 与 runtime 的链路改动直接影响桌面 GUI（embedded 帧面/收口语义），必须跑矩阵。
      - "apps/escode-host/**"
      - "apps/escode-cli-rust/**"
      - ".github/workflows/desktop-e2e-matrix.yml"
      - "scripts/bench-escode-app*"
  workflow_dispatch:
    inputs:
      specs:
        description: "逗号分隔的 spec 清单（相对 packages/desktop）；留空用仓库默认矩阵"
        required: false
        default: ""
        type: string
      ssh:
        description: "额外运行 SSH 远端 project 用例（Linux 容器目标 + macOS 本机 sshd 目标）"
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-e2e-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 rust-runtime-ci 一致的慢 runner 放宽值（fixture 请求/关闭预算）。
  ESCODE_TEST_REQUEST_MS: "60000"
  ESCODE_TEST_EXIT_MS: "15000"
  # 矩阵只跑正式目录下的 spec，不收 manual-review/pending。
  ESCODE_E2E_MAX_INSTANCES: "1"
  # `reloadElectronSessionSafely` 会在同一 worker 内重建 WebDriver session：慢 runner 上
  # 新 Electron 启动 + chromedriver 握手实测超过 30s 默认值（macOS/ubuntu 偶发裸 Timeout，
  # 三次推送各命中一次）。放宽到 120s 仍保留挂起边界，避免又回到数分钟不可中断的等待。
  ESCODE_E2E_WEBDRIVER_REQUEST_TIMEOUT_MS: "120000"
  ESCODE_E2E_SPEC: >-
    ${{ inputs.specs != '' && inputs.specs ||
    './test/e2e/smoke.test.ts,./test/e2e/infrastructure/session-lifecycle.test.ts,./test/e2e/conversation-session/conversation-session-rust-host-window-lifecycle.test.ts,./test/e2e/conversation-session/source-server-rust-server-direct.test.ts' }}

jobs:
  e2e:
    name: desktop e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Windows：Defender 实时扫描会拖慢大量小文件读写并短暂占用刚关闭的文件（EBUSY）。
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:LOCALAPPDATA\pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-host
          key: e2e-matrix
          cache-on-failure: true
      # Linux 无图形会话：WDIO 的 autoXvfb 会按需启动 Xvfb；显式安装以免依赖镜像预装。
      - name: linux display tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile
      # 非打包 E2E 的 Agent bundle 与 Rust Host debug 二进制由仓库脚本产出；
      # wdio onPrepare 也会在缺失时自举，这里先建一次让失败点更明确。
      - run: node scripts/build-desktop-agent-cli.mjs
      - name: build Rust Host (debug)
        run: cargo build --locked --manifest-path apps/escode-host/Cargo.toml
      # source-server-rust-server-direct 在 worker 内拉起真实 escode-server（HTTP/WS +
      # provider-provisioning channel），需要 packages/server/dist/entry-http.js 在场。
      - name: build escode-server
        run: pnpm --filter @escode/server build
      # onPrepare 会先跑 build:no-runtime-assets（tsup + vite），再启动 Electron。
      - name: run curated desktop E2E
        run: pnpm --filter @escode/desktop test:e2e:serial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-${{ matrix.os }}
          path: |
            packages/desktop/.e2e-artifacts
            packages/desktop/.e2e-home
          # .e2e-home / .e2e-artifacts 是隐藏目录，默认会被过滤掉，失败时拿不到 App 日志。
          include-hidden-files: true
          if-no-files-found: warn

  # SSH 远端 project 用例：自建 Ubuntu 24.04 sshd 容器，不依赖外部服务器或仓库 secrets。
  # 默认只在手动 dispatch 且勾选 ssh 时运行，避免每次 push 都多跑一条长链路。
  ssh-remote-project:
    name: desktop e2e (ubuntu-latest, ssh remote)
    if: github.event_name == 'workflow_dispatch' && inputs.ssh
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          # 远端 release 的 Rust runtime 走 musl 静态链接。
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-host
          key: e2e-ssh
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb musl-tools
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-agent-cli.mjs
      - name: build Rust Host (debug)
        run: cargo build --locked --manifest-path apps/escode-host/Cargo.toml
      # 直接调 wdio（不经 test:e2e 的 pretest）时 e2e-report 的 node 产物不会自动构建。
      - name: build e2e report node entry
        run: pnpm --filter @escode/e2e-report build:node
      - name: start dedicated SSH target
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ESCODE_E2E_SSH_PASSWORD=$password" >> "$GITHUB_ENV"
          bash scripts/e2e/start-ssh-e2e-server.sh 2222 "$password" /root/workspace
          # formal spec 的第二个 workspace 只用于平台契约校验；先建好避免后续双 workspace 用例跳过。
          docker exec escode-e2e-ssh mkdir -p /root/workspace-2
      - name: run SSH remote project E2E
        shell: bash
        env:
          ESCODE_E2E_MANUAL_REVIEW_HOLD_MS: "1800000"
          ESCODE_E2E_SSH_HOST: 127.0.0.1
          ESCODE_E2E_SSH_PORT: "2222"
          ESCODE_E2E_SSH_USERNAME: root
          # formal spec 读复数变量（默认 /root,/home）；Windows/WSL 与容器目标都用 root。
          ESCODE_E2E_SSH_WORKSPACE_PATHS: /root/workspace,/root/workspace-2
          ESCODE_E2E_SSH_WORKSPACE_PATH: /root/workspace
          ESCODE_E2E_SSH_REMOTE_ASSET_PLATFORMS: linux-x64
          ESCODE_REMOTE_ASSET_PLATFORMS: linux-x64
          # wdio `--spec` 不接受逗号分隔（会当成单个文件）；多 spec 走配置读取的 env。
          ESCODE_E2E_SPEC: >-
            ./test/e2e/conversation-session/source-server-rust-install.test.ts,
            ./test/e2e/conversation-session/source-server-rust-first-connect.test.ts,
            ./test/e2e/conversation-session/source-server-rust-restart-recovery.test.ts,
            ./test/e2e/conversation-session/source-server-rust-multi-window.test.ts,
            ./test/e2e/conversation-session/manual-review/pending/conversation-session-ssh-remote-project-create.test.ts
        run: |
          xvfb-run -a pnpm --filter @escode/desktop exec wdio run wdio.conf.ts
      - name: dump SSH target logs
        if: always()
        run: docker logs escode-e2e-ssh 2>&1 | tail -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-ssh-remote
          path: |
            packages/desktop/.e2e-artifacts
            packages/desktop/.e2e-home
          include-hidden-files: true
          if-no-files-found: warn

  # SSH 远端 project 用例（macOS 客户端 + darwin 远端）：macOS runner 没有 Docker，
  # 目标即 runner 自身——专用用户 + 本机 sshd + darwin-<arch> 远端 release，仍然不依赖
  # 外部服务器或仓库 secrets。远端平台按 runner 架构推导，避免绑定 arm64/x64 某一代镜像。
  ssh-remote-project-macos:
    name: desktop e2e (macos-14, ssh remote)
    if: github.event_name == 'workflow_dispatch' && inputs.ssh
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-host
          key: e2e-ssh-macos
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-agent-cli.mjs
      - name: build Rust Host (debug)
        run: cargo build --locked --manifest-path apps/escode-host/Cargo.toml
      # 直接调 wdio（不经 test:e2e 的 pretest）时 e2e-report 的 node 产物不会自动构建。
      - name: build e2e report node entry
        run: pnpm --filter @escode/e2e-report build:node
      - name: start local ssh target
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ESCODE_E2E_SSH_PASSWORD=$password" >> "$GITHUB_ENV"
          workspace="/Users/escode-e2e/workspace"
          bash scripts/e2e/start-ssh-e2e-server-macos.sh 2222 "$password" "$workspace"
          sudo -u escode-e2e mkdir -p "${workspace}-2"
          echo "ESCODE_E2E_SSH_WORKSPACE_PATH=$workspace" >> "$GITHUB_ENV"
          if [ "$(uname -m)" = "arm64" ]; then remote_platform=darwin-arm64; else remote_platform=darwin-x64; fi
          echo "ESCODE_E2E_SSH_REMOTE_ASSET_PLATFORMS=$remote_platform" >> "$GITHUB_ENV"
          echo "ESCODE_REMOTE_ASSET_PLATFORMS=$remote_platform" >> "$GITHUB_ENV"
      - name: run SSH remote project E2E
        env:
          ESCODE_E2E_MANUAL_REVIEW_HOLD_MS: "1800000"
          ESCODE_E2E_SSH_HOST: 127.0.0.1
          ESCODE_E2E_SSH_PORT: "2222"
          ESCODE_E2E_SSH_USERNAME: escode-e2e
          ESCODE_E2E_SSH_WORKSPACE_PATHS: /Users/escode-e2e/workspace,/Users/escode-e2e/workspace-2
          ESCODE_E2E_SPEC: >-
            ./test/e2e/conversation-session/source-server-rust-install.test.ts,
            ./test/e2e/conversation-session/source-server-rust-first-connect.test.ts,
            ./test/e2e/conversation-session/source-server-rust-restart-recovery.test.ts,
            ./test/e2e/conversation-session/source-server-rust-multi-window.test.ts,
            ./test/e2e/conversation-session/manual-review/pending/conversation-session-ssh-remote-project-create.test.ts
        run: |
          pnpm --filter @escode/desktop exec wdio run wdio.conf.ts
      - name: dump SSH target log
        if: always()
        run: sudo cat /tmp/escode-e2e-sshd.log 2>&1 | tail -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-ssh-remote-macos
          path: |
            packages/desktop/.e2e-artifacts
            packages/desktop/.e2e-home
          include-hidden-files: true
          if-no-files-found: warn

  # Windows 客户端的远程目标只能是 POSIX（source server release 只有 linux/darwin），
  # 而 windows runner 没有 Docker；这里用镜像自带的 WSL2 Ubuntu 作为真实 Linux SSH 目标，
  # 与产品支持的 Windows 远程场景（WSL/SSH/Docker 都是 Linux）一致。远端 Rust runtime 用
  # 纯 Linux 侧预构建的 musl 产物，避免在 Windows 上交叉编译 musl。
  remote-rust-musl:
    name: remote rust runtime (linux-x64 musl)
    if: github.event_name == 'workflow_dispatch' && inputs.ssh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-cli-rust
          key: remote-rust-linux-x64-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build remote rust runtime
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p escode-cli-rust
        working-directory: apps/escode-cli-rust
      - uses: actions/upload-artifact@v4
        with:
          name: remote-rust-linux-x64-musl
          path: apps/escode-cli-rust/target/x86_64-unknown-linux-musl/release/escode-cli-rust
          if-no-files-found: error

  ssh-remote-project-windows:
    name: desktop e2e (windows-latest, ssh remote)
    if: github.event_name == 'workflow_dispatch' && inputs.ssh
    needs: remote-rust-musl
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:LOCALAPPDATA\pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-host
          key: e2e-ssh-windows
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          name: remote-rust-linux-x64-musl
          path: ${{ runner.temp }}/remote-rust-artifact
      - name: stage remote rust runtime
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/remote-rust/linux-x64"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/remote-rust-artifact/escode-cli-rust" "$dest/escode-cli-rust"
          chmod 755 "$dest/escode-cli-rust"
          echo "ESCODE_REMOTE_RUST_BINARIES_DIR=$RUNNER_TEMP/remote-rust" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-agent-cli.mjs
      - name: build Rust Host (debug)
        run: cargo build --locked --manifest-path apps/escode-host/Cargo.toml
      # 直接调 wdio（不经 test:e2e 的 pretest）时 e2e-report 的 node 产物不会自动构建。
      - name: build e2e report node entry
        run: pnpm --filter @escode/e2e-report build:node
      - name: start WSL ssh target
        shell: bash
        run: |
          set -euo pipefail
          # git-bash 会把传给 wsl.exe 的 /mnt/<drive>/... 当成 MSYS 路径改写成
          # "C:/Program Files/Git/mnt/..."，WSL 里就找不到仓库脚本；这里关闭自动转换。
          export MSYS_NO_PATHCONV=1
          export MSYS2_ARG_CONV_EXCL='*'
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "ESCODE_E2E_SSH_PASSWORD=$password" >> "$GITHUB_ENV"
          wsl --status || true
          if ! wsl -l -q 2>/dev/null | tr -d '\0\r' | grep -qx 'Ubuntu-22.04'; then
            wsl --install --web-download --no-launch --distribution Ubuntu-22.04 || {
              wsl --update
              wsl --install --web-download --no-launch --distribution Ubuntu-22.04
            }
          fi
          wsl -l -v || true
          repo_wsl="/mnt/$(cygpath -w "$PWD" | sed -e 's|\\|/|g' -e 's|^\([A-Za-z]\):|\L\1|')"
          wsl -d Ubuntu-22.04 -u root -- bash "$repo_wsl/scripts/e2e/start-ssh-e2e-server-wsl.sh" "$password" /root/workspace
          wsl -d Ubuntu-22.04 -u root -- mkdir -p /root/workspace-2
      # Bug 根因：该步骤此前用 bash，node 侧读到的 /root/workspace 被 git-bash 的 MSYS
      # 环境变量改写规则换成了 "C:/Program Files/Git/root/workspace"，helpers 的
      # `startsWith("/")` 断言随即失败。改用 pwsh（原生进程）并单行调用，避免 env 改写。
      - name: check SSH env reaches node unchanged
        env:
          ESCODE_E2E_SSH_WORKSPACE_PATH: /root/workspace
        run: node -e "console.log('workspacePath=' + process.env.ESCODE_E2E_SSH_WORKSPACE_PATH)"
      - name: run SSH remote project E2E
        env:
          ESCODE_E2E_MANUAL_REVIEW_HOLD_MS: "1800000"
          ESCODE_E2E_SSH_HOST: 127.0.0.1
          ESCODE_E2E_SSH_PORT: "2222"
          ESCODE_E2E_SSH_USERNAME: root
          ESCODE_E2E_SSH_WORKSPACE_PATHS: /root/workspace,/root/workspace-2
          ESCODE_E2E_SSH_WORKSPACE_PATH: /root/workspace
          ESCODE_E2E_SSH_REMOTE_ASSET_PLATFORMS: linux-x64
          ESCODE_REMOTE_ASSET_PLATFORMS: linux-x64
          ESCODE_E2E_SPEC: >-
            ./test/e2e/conversation-session/source-server-rust-install.test.ts,
            ./test/e2e/conversation-session/source-server-rust-first-connect.test.ts,
            ./test/e2e/conversation-session/source-server-rust-restart-recovery.test.ts,
            ./test/e2e/conversation-session/source-server-rust-multi-window.test.ts,
            ./test/e2e/conversation-session/manual-review/pending/conversation-session-ssh-remote-project-create.test.ts
        run: pnpm --filter @escode/desktop exec wdio run wdio.conf.ts
      - name: dump WSL sshd log
        if: always()
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          export MSYS2_ARG_CONV_EXCL='*'
          wsl -d Ubuntu-22.04 -u root -- tail -200 /tmp/escode-e2e-sshd.log 2>/dev/null || true
      # 远端 Source Server 的安装/启动状态只在 WSL 内可见；失败时先确认是部署没跑、
      # 还是部署完成但控制端读目录失败。
      - name: dump WSL remote source server state
        if: always()
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          export MSYS2_ARG_CONV_EXCL='*'
          wsl -d Ubuntu-22.04 -u root -- bash -lc '
            set +e
            echo "== workspace =="; ls -ld /root/workspace 2>&1
            echo "== .escode =="; ls -la /root/.escode 2>&1 | head -20
            echo "== server =="; ls -la /root/.escode/server 2>&1 | head -30
            echo "== logs =="; for f in /root/.escode/logs/*.log; do [ -f "$f" ] && { echo "--- $f"; tail -80 "$f"; }; done
            echo "== processes =="; ps -eo pid,ppid,args | grep -E "escode|zcode-server" | grep -v grep | head -20
          ' 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-ssh-remote-windows
          path: |
            packages/desktop/.e2e-artifacts
            packages/desktop/.e2e-home
          include-hidden-files: true
          if-no-files-found: warn

  # App 级性能测量（docs/specs/rust-unified-host.md §5）：首段延迟 + 4 路并发流式 CPU。
  # 只在 Linux 跑：CPU/内存读数只与同平台历史比较才有意义，且 Xvfb 环境可重复。
  app-perf:
    name: app perf (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-host
          key: app-perf
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-agent-cli.mjs
      # 直接调 wdio（不经 test:e2e 的 pretest）时 e2e-report 的 node 产物不会自动构建，
      # 报告钩子会因 @escode/e2e-report/dist-node 缺失而失败。
      - name: build e2e report node entry
        run: pnpm --filter @escode/e2e-report build:node
      - name: build Rust Host (debug) and Rust runtime (release)
        run: |
          cargo build --locked --manifest-path apps/escode-host/Cargo.toml
          cargo build --release --locked --manifest-path apps/escode-cli-rust/Cargo.toml --bin escode-cli-rust
      # Node runtime 已退场：同一负载只测 Rust Agent runtime。
      - name: measure (rust runtime)
        env:
          ESCODE_APP_PERF_LABEL: rust
          ESCODE_AGENT_SERVER_COMMAND: ${{ github.workspace }}/apps/escode-cli-rust/target/release/escode-cli-rust
          E2E_PROVIDER_REPLAY_FIXTURE_PATH: >-
            packages/desktop/test/e2e/fixtures/upstream/common.json,packages/desktop/test/e2e/fixtures/upstream/perf/app-perf-streaming.json
          ESCODE_E2E_ARTIFACT_DIR: ${{ github.workspace }}/packages/desktop/.e2e-artifacts/app-perf
        run: |
          xvfb-run -a pnpm --filter @escode/desktop exec wdio run wdio.conf.ts \
            --spec ./test/e2e/perf/app-perf-streaming.perf.ts
      # 多 workspace 与优雅退出：每个 workspace 打开后真实跑一轮会话，检查点 N=1/4/8。
      - name: measure workspaces (rust runtime)
        env:
          ESCODE_APP_PERF_LABEL: rust
          ESCODE_AGENT_SERVER_COMMAND: ${{ github.workspace }}/apps/escode-cli-rust/target/release/escode-cli-rust
          E2E_PROVIDER_REPLAY_FIXTURE_PATH: >-
            packages/desktop/test/e2e/fixtures/upstream/common.json,packages/desktop/test/e2e/fixtures/upstream/perf/app-perf-streaming.json
          ESCODE_E2E_ARTIFACT_DIR: ${{ github.workspace }}/packages/desktop/.e2e-artifacts/app-perf
        run: |
          xvfb-run -a pnpm --filter @escode/desktop exec wdio run wdio.conf.ts \
            --spec ./test/e2e/perf/app-perf-workspaces.perf.ts
      # 首段：应用内计时（submit 事件 → 首个 assistant 文本渲染），fixture 首字在 1ms。
      - name: measure first segment (rust runtime)
        env:
          ESCODE_APP_PERF_LABEL: rust
          ESCODE_AGENT_SERVER_COMMAND: ${{ github.workspace }}/apps/escode-cli-rust/target/release/escode-cli-rust
          E2E_PROVIDER_REPLAY_FIXTURE_PATH: >-
            packages/desktop/test/e2e/fixtures/upstream/common.json,packages/desktop/test/e2e/fixtures/upstream/perf/app-perf-streaming.json
          ESCODE_E2E_ARTIFACT_DIR: ${{ github.workspace }}/packages/desktop/.e2e-artifacts/app-perf
        run: |
          xvfb-run -a pnpm --filter @escode/desktop exec wdio run wdio.conf.ts \
            --spec ./test/e2e/perf/app-perf-first-segment.perf.ts
      - name: summarize app perf
        if: always()
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const dir = "packages/desktop/.e2e-artifacts/app-perf";
          const list = fs.existsSync(dir) ? fs.readdirSync(dir) : [];
          const streaming = list.filter((name) => /^app-perf-streaming\..*\.json$/.test(name));
          const workspaces = list.filter((name) => /^app-perf-workspaces\..*\.json$/.test(name));
          console.log("### App 级性能（linux-x64，4 路并发流式）\n");
          console.log("| runtime | 首段中位数 ms | 首段最大 ms | 流式 CPU 中位数 % | 流式峰值 % | 工作集中位数 MiB | 空闲工作集 MiB |");
          console.log("| --- | ---: | ---: | ---: | ---: | ---: | ---: |");
          for (const name of streaming) {
            const data = JSON.parse(fs.readFileSync(`${dir}/${name}`, "utf8"));
            console.log(
              `| ${data.runtimeLabel} | ${data.firstSegmentMs.median} | ${data.firstSegmentMs.max} | ` +
                `${data.streaming.cpuPercentMedian.toFixed(1)} | ${data.streaming.cpuPercentMax.toFixed(1)} | ` +
                `${data.streaming.workingSetMiBMedian.toFixed(1)} | ${data.idle.workingSetMiB.toFixed(1)} |`,
            );
          }
          console.log("\n口径：点击发送到该 lane 首个 assistant 文本可见；CPU 为全进程树求和，500ms 采样。");
          console.log("\n### 多 workspace 与优雅退出（每个 workspace 跑一轮会话）\n");
          console.log("| runtime | Host+Agent 斜率 MiB/ws | App 树斜率 MiB/ws | 端点差 MiB/ws | N=1 MiB | N=8 MiB | 退出 ms |");
          console.log("| --- | ---: | ---: | ---: | ---: | ---: | ---: |");
          for (const name of workspaces) {
            const data = JSON.parse(fs.readFileSync(`${dir}/${name}`, "utf8"));
            const first = data.checkpoints.find((point) => point.workspaceCount === 1);
            const last = data.checkpoints.find((point) => point.workspaceCount === data.workspaceCount);
            console.log(
              `| ${data.runtimeLabel} | ${data.perWorkspaceHostMiB.toFixed(2)} | ${data.perWorkspaceAppTreeMiB.toFixed(2)} | ` +
                `${data.perWorkspaceEndpointMiB.toFixed(2)} | ${first.workingSetMiB.toFixed(1)} | ` +
                `${last.workingSetMiB.toFixed(1)} | ${data.exitMs} |`,
            );
          }
          console.log("\n口径：斜率为 N=1..8 八个点的最小二乘；主指标是 Host+Agent 子集（App 树受 renderer GC 影响可为负）；退出为 `app.quit()` 到主进程消失（含 before-quit 清理）。");
          const firstSegments = list.filter((name) => /^app-perf-first-segment\..*\.json$/.test(name));
          console.log("\n### 首条消息第一段（应用内计时：submit → 首个 assistant 文本）\n");
          console.log("| runtime | 中位数 ms | 最大 ms | 采样值 ms |");
          console.log("| --- | ---: | ---: | --- |");
          for (const name of firstSegments) {
            const data = JSON.parse(fs.readFileSync(`${dir}/${name}`, "utf8"));
            console.log(
              `| ${data.runtimeLabel} | ${data.firstSegmentMs.median.toFixed(1)} | ` +
                `${data.firstSegmentMs.max.toFixed(1)} | ${data.firstSegmentMs.values
                  .map((value) => value.toFixed(1))
                  .join(", ")} |`,
            );
          }
          console.log("\n口径：fixture 首字延迟 1ms，因此该值≈提交→渲染的 App 侧开销，不含真实模型首字延迟。");
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-perf
          path: packages/desktop/.e2e-artifacts/app-perf
          if-no-files-found: warn
