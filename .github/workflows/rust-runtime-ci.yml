# Rust runtime 的跨平台验证：Windows（MSVC）、macOS、Linux 上跑同一套 Rust 与 App 集成测试。
# 见 docs/specs/rust-ci.md。默认 runtime 仍是 Node；这里只验证 Rust runtime 与其接入。
name: rust-runtime-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 测试只需要 Node 侧依赖，不需要 Electron 运行时。
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # 每个用例都会起 runtime + 本地模型服务；runner 上并发易被接收超时误伤。
  ESCODE_TEST_SERIAL: "1"
  # fixture 的请求上限默认 5s，慢 runner 上 runtime 启动（Node bundle / Rust debug 二进制）会超：
  # macos runner 实测 subscribe 超 5s，整套 12 个用例报 ESCodeProtocolRequestTimeoutError。
  # 与安装包演练（release.yml）取同一放宽值；真挂死仍由 300s 用例超时兜底。
  ESCODE_TEST_REQUEST_MS: "60000"
  # fixture 关闭预算（等子进程退出的上限，默认 4s）：慢机/并发负载下 workflow、hooks、媒体
  # 场景的收尾会在 4s 边缘被 SIGKILL（本地实测）；放宽后真挂死仍由用例超时兜底。
  ESCODE_TEST_EXIT_MS: "15000"

jobs:
  checks:
    name: checks (lint, typecheck, fmt, clippy, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-cli-rust
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:escode-cli-rust
      # 依赖与许可证策略（apps/escode-cli-rust/deny.toml）：advisories / licenses 白名单 / bans / sources。
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: apps/escode-cli-rust/Cargo.toml
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm architecture:check

  test:
    name: test (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      # windows-latest 默认即 MSVC 工具链（x86_64-pc-windows-msvc），补上本仓库此前无法在本机验证的 MSVC 目标。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-cli-rust
      # 测试运行器：重试、慢测试超时与 JUnit 配置见 apps/escode-cli-rust/.config/nextest.toml。
      - uses: taiki-e/install-action@nextest
      - run: pnpm install --frozen-lockfile
      # 生成资产漂移检查、cargo test/nextest、App 集成套件（针对 Rust 二进制）。
      - run: pnpm test:escode-cli-rust
        shell: bash

  # 三平台原生 release 延迟与内存（发布门槛「性能」：三平台 release 延迟，docs/specs/rust-runtime-performance.md）。
  # 同一本地 SSE workload 下 Node 与 Rust 交错 5 次配对；结果写入 job summary 与 artifact，不作为失败门槛。
  bench:
    name: bench (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-cli-rust
          key: release
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-agent-cli.mjs
      - run: cargo build --release --locked --manifest-path apps/escode-cli-rust/Cargo.toml --bin escode-cli-rust
      - name: Node vs Rust paired benchmark
        shell: bash
        run: |
          node scripts/bench-escode-cli-node-rust.mjs apps/escode-cli/packages/cli/dist/escode.cjs "" bench-results 5
          {
            echo "### Node vs Rust (${{ matrix.os }}, median of 5)"
            echo '```json'
            cat bench-results/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 差分门禁（docs/specs/rust-unified-host.md §4.2）：同一确定性场景在 Node bundle 与 Rust
      # 二进制上各跑一次，归一化后逐面（消息帧 / 存储进度 / 事件流 / 模型请求 / 工作区文件）对拍；
      # 出现新差异（既非已批准、也不在欠账基线内）即失败，evidence 与报告随 artifact 上传。
      # 观察期：基线指纹此前只在本机 Windows 验证稳定；三平台首次全绿后去掉 continue-on-error 转阻塞
      # （转阻塞条件记录在 docs/specs/rust-unified-host.md 阶段 0 的切片条目）。
      - name: Node vs Rust parity differential (session-baseline)
        shell: bash
        continue-on-error: true
        run: |
          node scripts/diff-escode-cli-rust-parity.mjs
          {
            echo "### parity (session-baseline, ${{ matrix.os }})"
            cat .escode-runtime/parity/session-baseline.report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: .escode-runtime/parity
