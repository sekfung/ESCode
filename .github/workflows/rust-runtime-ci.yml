# Rust runtime 的跨平台验证：Windows（MSVC）、macOS、Linux 上跑同一套 Rust 与 App 集成测试。
# 见 docs/specs/rust-ci.md。默认 runtime 仍是 Node；这里只验证 Rust runtime 与其接入。
name: rust-runtime-ci

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      # 定位单平台问题时只跑该平台（如 '["windows-latest"]'）；push / PR 触发时为空，回落三平台全量。
      # 验收仍以三平台全量运行为准（docs/specs/rust-ci.md）。
      platforms:
        description: 'JSON 数组：要跑的 runner，如 ["windows-latest"]'
        required: false
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
        type: string

concurrency:
  group: rust-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # 测试只需要 Node 侧依赖，不需要 Electron 运行时。
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # 每个用例都会起 runtime + 本地模型服务；runner 上并发易被接收超时误伤。
  ESCODE_TEST_SERIAL: "1"
  # fixture 的请求上限默认 5s，慢 runner 上 runtime 启动（Node bundle / Rust debug 二进制）会超：
  # macos runner 实测 subscribe 超 5s，整套 12 个用例报 ESCodeProtocolRequestTimeoutError。
  # 与安装包演练（release.yml）取同一放宽值；真挂死仍由 300s 用例超时兜底。
  ESCODE_TEST_REQUEST_MS: "60000"
  # fixture 关闭预算（等子进程退出的上限，默认 4s）：慢机/并发负载下 workflow、hooks、媒体
  # 场景的收尾会在 4s 边缘被 SIGKILL（本地实测）；放宽后真挂死仍由用例超时兜底。
  ESCODE_TEST_EXIT_MS: "15000"

jobs:
  checks:
    name: checks (${{ matrix.os }})
    # H0「门禁在 CI 三平台都跑」：clippy 需要在各平台 cfg 下各 lint 一遍，边界/typecheck/lint/architecture
    # 也在 Windows 路径语义下各跑一遍（docs/specs/rust-ci.md）。
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Windows：把工作区与临时目录排除出 Defender 实时扫描。测试大量 spawn 进程、读写小文件，实时扫描
      # 显著拖慢编译与集成套件，并会短暂占用刚关闭的文件（EBUSY）。仅影响 CI runner。
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:LOCALAPPDATA\pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/escode-cli-rust
            apps/escode-host
          # 失败的作业也保存依赖编译缓存：默认只在成功时保存，修红期间每轮都从零编译。
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:escode-cli-rust
      # 阶段 2 Host 工作区（apps/escode-host）：边界（分层/400 行/0 处进程 env）+ fmt + clippy。
      - run: pnpm check:escode-host
      # 依赖与许可证策略（两个 workspace 各自的 deny.toml）：advisories / licenses 白名单 / bans / sources。
      # cargo-deny-action 是 Docker action，只能在 Linux runner 上跑；依赖图按全部目标平台解析，结果与宿主 OS 无关。
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: runner.os == 'Linux'
        with:
          manifest-path: apps/escode-cli-rust/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: runner.os == 'Linux'
        with:
          manifest-path: apps/escode-host/Cargo.toml
      # 全仓 tsc -b 在 macOS arm64 runner（7 GB 内存，V8 默认堆上限约 2 GB）上堆 OOM（exit 134）；
      # checks 扩到三平台后首次暴露。只放宽这一步，与 build-desktop-agent-cli.mjs 的做法一致。
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=5120
      - run: pnpm lint
      - run: pnpm architecture:check

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/3)
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        # App 集成套件串行约 37 分钟（Windows）：按文件轮转分 3 片并行。第 1 片另跑与分片无关的检查、
        # cargo 测试与 test:escode-host（scripts/test-escode-cli-rust.mjs 的 ESCODE_TEST_SHARD）。
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # Windows：把工作区与临时目录排除出 Defender 实时扫描。测试大量 spawn 进程、读写小文件，实时扫描
      # 显著拖慢编译与集成套件，并会短暂占用刚关闭的文件（EBUSY）。仅影响 CI runner。
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:LOCALAPPDATA\pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      # windows-latest 默认即 MSVC 工具链（x86_64-pc-windows-msvc），补上本仓库此前无法在本机验证的 MSVC 目标。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # test 作业同时跑 test:escode-host，两个 workspace 都要缓存（过去只缓存 CLI，Host 每轮冷编译）。
          workspaces: |
            apps/escode-cli-rust
            apps/escode-host
          cache-on-failure: true
      # 测试运行器：重试、慢测试超时与 JUnit 配置见 apps/escode-cli-rust/.config/nextest.toml。
      - uses: taiki-e/install-action@nextest
      # PDF 页渲染用例（Read 工具）依赖 poppler；golden 在本地以同一工具录制。
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      # 生成资产漂移检查、cargo test/nextest、App 集成套件（针对 Rust 二进制）。
      - run: pnpm test:escode-cli-rust
        shell: bash
        env:
          ESCODE_TEST_SHARD: ${{ matrix.shard }}/3
      # 阶段 2 Host：cargo 单测（实例表/控制通路/入口端到端/settings 域）+ 双 Host settings 交替写读演练。
      - if: matrix.shard == 1
        run: pnpm test:escode-host
        shell: bash

  # 三平台原生 release 延迟与内存（发布门槛「性能」：三平台 release 延迟，docs/specs/rust-runtime-performance.md）。
  # 同一本地 SSE workload 下 Node 与 Rust 交错 5 次配对；结果写入 job summary 与 artifact，不作为失败门槛。
  bench:
    name: bench (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.platforms || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Windows：把工作区与临时目录排除出 Defender 实时扫描。测试大量 spawn 进程、读写小文件，实时扫描
      # 显著拖慢编译与集成套件，并会短暂占用刚关闭的文件（EBUSY）。仅影响 CI runner。
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:LOCALAPPDATA\pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/escode-cli-rust
          key: release
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-desktop-agent-cli.mjs
      - run: cargo build --release --locked --manifest-path apps/escode-cli-rust/Cargo.toml --bin escode-cli-rust
      - name: Node vs Rust paired benchmark
        shell: bash
        run: |
          node scripts/bench-escode-cli-node-rust.mjs apps/escode-cli/packages/cli/dist/escode.cjs "" bench-results 5
          {
            echo "### Node vs Rust (${{ matrix.os }}, median of 5)"
            echo '```json'
            cat bench-results/summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 差分门禁（docs/specs/rust-unified-host.md §4.2 / 阶段 3 golden freeze）：
      # 平台 golden 存在时只跑 Rust 并对冻结观察判定（阻塞）；缺失时保留 Node/Rust 实时双跑
      # （观察期）并输出录制提示。golden 落库后本步骤自动切换，不再需要改 workflow。
      - name: Resolve parity golden for this platform
        id: parity-golden
        shell: bash
        run: |
          token="$(node -p "process.platform + '-' + process.arch")"
          file="scripts/fixtures/parity/session-baseline.${token}.node.golden.json"
          if [ -f "$file" ]; then
            echo "mode=golden" >> "$GITHUB_OUTPUT"
            echo "file=$file" >> "$GITHUB_OUTPUT"
          else
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "::warning file=${file}::平台 parity golden 尚未录制；本次按观察期实时双跑。用 record cli goldens workflow 录制并提交后自动切换阻塞门禁"
          fi
      - name: Rust parity against frozen golden (session-baseline)
        if: steps.parity-golden.outputs.mode == 'golden'
        shell: bash
        run: |
          node scripts/diff-escode-cli-rust-parity.mjs --golden
          {
            echo "### parity golden (session-baseline, ${{ matrix.os }})"
            cat .escode-runtime/parity/session-baseline.report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Node vs Rust parity differential (session-baseline, live oracle)
        if: steps.parity-golden.outputs.mode == 'live'
        shell: bash
        continue-on-error: true
        run: |
          node scripts/diff-escode-cli-rust-parity.mjs
          {
            echo "### parity (session-baseline, ${{ matrix.os }}, observation)"
            cat .escode-runtime/parity/session-baseline.report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: .escode-runtime/parity
