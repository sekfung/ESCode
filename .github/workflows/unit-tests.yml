# 单元测试门禁：按 diff 选测试（scripts/run-affected-unit-tests.mjs），PR 上只跑改动波及的用例。
#
# 为什么必须 fetch-depth: 0：受影响 runner 要对基线 commit 做 diff（ESCODE_AFFECTED_TEST_BASE）；
# actions/checkout 默认浅克隆只有 1 个 commit，diff 无从谈起 —— 那样它会静默退化成全量或报错。
#
# 与 pre-push 的关系：本仓库本地门禁是 verify:pre-push（lint + architecture:check --changed +
# test:unit:affected），但那只在开发机上跑、且只覆盖已提交的区间。这个 job 把其中唯一缺席 CI 的一环
# 补上：lint 与 architecture:check 已在 rust-runtime-ci 的 checks job 里跑。
name: unit-tests

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 rust-runtime-ci 一致：单元测试不启动 Electron，省掉每次约 120 MB 的二进制下载。
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # 部分用例会起本地服务与子进程；runner 争用时容易撞接收超时（rust-runtime-ci 的同名放宽）。
  ESCODE_TEST_REQUEST_MS: "60000"

jobs:
  affected:
    name: unit tests (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 全量单测在 threads 池的 worker 收尾时会触发原生崩溃（Napi::Error / core dumped，
      # 见 unit-tests 历史日志）；改用进程隔离，测试范围不变，并发降到 2。
      ESCODE_TEST_POOL: forks
    steps:
      - uses: actions/checkout@v4
        with:
          # 受影响 runner 需要基线 commit 才能算 diff；浅克隆会让它退化成全量或直接失败。
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 不能依赖 pnpm 的 side-effects cache：历史上本 job 在 ELECTRON_SKIP_BINARY_DOWNLOAD=1
      # 下安装过 electron，后续 install/rebuild 不会重跑 postinstall，导致 10 个直接 import
      # electron 的 desktop suite 在 import 阶段失败。直接执行官方 install.js 并验证二进制在场。
      - name: 安装 Electron 二进制
        run: |
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          node node_modules/electron/install.js
          node -e "require('electron')"

      # 真实 @escode/client 连接 Rust Host 的用例（rustHostRpc / rustHostRuntimeCrash）依赖两个
      # 二进制；此前本 job 不构建它们，`it.skipIf(!existsSync(...))` 会把这些用例静默跳过
      # （M2 报告 §9 的 UNVERIFIED）。构建口径与 rust-runtime-ci 的 test 作业一致。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/escode-cli-rust
            apps/escode-host
      - name: 构建 Rust Host 与 CLI
        run: |
          cargo build --locked --manifest-path apps/escode-cli-rust/Cargo.toml --bin escode-cli-rust
          cargo build --locked --manifest-path apps/escode-host/Cargo.toml --bin escode-host

      # 这些套件 import 的是工作区包的 dist 入口，全新 checkout 缺构建产物会以 ERR_MODULE_NOT_FOUND /
      # "Failed to resolve entry for package" 失败（本机因早已构建过而看不出）。只构建单测真正用到的
      # 库与 agent 包闭包：测试从不 import web 这类前端应用包（e2e-report 只用其 node 入口，见下），而它们的发行构建
      # 在全新 checkout 里有既有的子路径解析问题（@escode/shared/mcp-apps），单测并不需要。
      # 官方插件包全部构建：browser-use 的 scripts/browser-client.mjs 是 required seed，
      # 缺它时整个插件被判为残缺，control-browser/web-gui-tester 等技能不会出现；
      # 其它插件同样提供 MCP server / dist 资产（rea、serial 等）。
      - name: 构建单测依赖的工作区包
        run: |
          pnpm -r \
            --filter "@escode/bootstrap..." \
            --filter "@escode/rpc..." \
            --filter "@escode/services..." \
            --filter "@escode/server..." \
            --filter "@escode/node-repl-host..." \
            --filter "@escode/escode-cua..." \
            --filter "@escode/*-plugin..." \
            build
          # desktop 的 e2eReporting* 单测 import @escode/e2e-report 的 node 入口（dist-node）；只跑 tsc 的
          # build:node，不跑有子路径解析问题的 viewer（vite）构建。
          pnpm --filter @escode/e2e-report build:node

      # 基线取 PR 的目标分支 sha；push 取本次推送前的 sha。拿不到有效 commit（新分支的零 sha、
      # 强推、深历史缺失等）时回落全量单测 —— 宁可多跑，也不让门禁静默失效。
      - name: 受影响单测（无有效基线时回落全量）
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && printf '%s' "$BASE" | grep -qE '^[0-9a-f]{40}$' && ! printf '%s' "$BASE" | grep -qE '^0{40}$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "受影响单测，基线 $BASE"
            ESCODE_AFFECTED_TEST_BASE="$BASE" pnpm test:unit:affected
          else
            echo "没有可用基线（base='$BASE'），回落全量单测"
            pnpm test:unit
          fi

  # bootstrap 套件此前没有任何 CI 覆盖：rust-runtime-ci 的 checks 只跑 check:escode-cli-rust /
  # typecheck / lint / architecture:check，test job 跑的是 test:escode-cli-rust（Rust 侧脚本与
  # packages/services 的 escode-cli-rust 集成用例），都不含 packages/bootstrap 的 vitest 套件。
  bootstrap:
    name: bootstrap suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 与 affected job 同样的构建口径（见那里的说明）：单测 import 的是库与 agent 包的 dist 入口，
      # 前端应用包的发行构建单测不需要；@escode/rea-plugin 的 dist/mcp/server.js 会被该包的 seed 断言检查。
      - name: 构建单测依赖的工作区包
        run: |
          pnpm -r \
            --filter "@escode/bootstrap..." \
            --filter "@escode/rpc..." \
            --filter "@escode/services..." \
            --filter "@escode/server..." \
            --filter "@escode/node-repl-host..." \
            --filter "@escode/escode-cua..." \
            --filter "@escode/*-plugin..." \
            build
      # 显式 `vitest run`：包内 test 脚本是 `vitest tests`（无 run），CI 上必须带 run 才是单次执行。
      # bootstrap 是集成套件（真 sqlite/协议/子进程），默认 5s 会让慢用例在并发 runner 上误超时；
      # 30s 与其它集成套件的预算一致。
      - run: pnpm --filter @escode/bootstrap exec vitest run tests --testTimeout=30000

  # Windows 专属：RustHostStartError 的 errno 分类（ENOENT 以外的 EACCES 等）只在 Windows 的
  # spawn 失败分支出现，ubuntu 的 affected job 覆盖不到。四类启动失败用 Node 脚本冒充 Host，
  # 不需要 Rust 二进制，也不需要构建 workspace dist（测试 import 的是 src/*.ts）。
  rust-host-windows:
    name: rust host startup errors (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/desktop/test/rustHostResilience.test.ts
