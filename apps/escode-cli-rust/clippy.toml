# Clippy 配置（docs/specs/rust-unified-host.md「实现质量对齐工作包」）：
# 测试代码放宽 unwrap/expect/print；生产代码的 unwrap_used / expect_used 属渐进清零项，
# 按 crate 清零后在 Cargo.toml 的 [workspace.lints.clippy] 逐项加入。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# 网络出口单入口（rust-unified-host.md P1 #6）：HTTP 客户端只在 crates/net 构造。
# 三处调用方（模型 / MCP / WebFetch+插件下载）各自保留超时与重定向参数，代理与 CA 策略集中在 net。
disallowed-methods = [
  { path = "reqwest::Client::builder", reason = "网络出口统一经 crates/net（docs/specs/rust-net-proxy.md）" },
  { path = "reqwest_mcp::Client::builder", reason = "网络出口统一经 crates/net（docs/specs/rust-net-proxy.md）" },
]
