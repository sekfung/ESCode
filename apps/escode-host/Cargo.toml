[workspace]
members = [
  ".",
  "crates/host-core",
  "crates/host-proto",
  "crates/host-gateway",
  "crates/host-control",
  "crates/host-runtime",
  "crates/host-services",
  "crates/host-surface",
  "crates/host-rpc",
]
resolver = "2"

# 24 个集成测试各自静态链接完整依赖图，完整 debuginfo 下单个约 600MB；
# target 曾在三天内累积到 300G。测试目标及依赖只保留行表（backtrace 仍有文件行号）。
[profile.test]
debug = 1

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# 与 apps/escode-cli-rust 同一份 deny 清单（docs/specs/rust-unified-host.md 阶段 0 护栏）。
[workspace.lints.clippy]
await_holding_lock = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_collect = "deny"
needless_question_mark = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_to_owned = "deny"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
saphyr = { version = "0.1", default-features = false }
# skill-sync 归档：TS 用 node:zlib gzip + 手写 ustar tar；Rust 只借 gzip 编解码，tar 自己按字节写。
flate2 = "1"
# settings-sync：Codex MCP 配置是 TOML（TS 用 `smol-toml`）。
toml = "0.8"
base64 = "0.22"
async-trait = "0.1"
# V4 topic 物理帧 checksum（TS `crc32WireBytes` = CRC-32/ISO-HDLC；CLI 侧同依赖）。
crc32fast = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# hooks 配置写回需要保留 JSON 键序（TS 用 JSON.parse/展开保序；持久化 L5 逐字节对拍）。
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.30.0"
tempfile = "3"
# 共享基础代码复用 CLI 侧 crate（阶段 1 库化红利；见 rust-u2-host-skeleton.md §2）。
# ICU4X：`file.readdir` 的排序要对齐 Node `String.prototype.localeCompare`
# （ICU 默认 collation，UCA/CLDR；见 host-rpc/src/collation.rs 的差分证据）。
icu_collator = "2"
icu_locale_core = "2"
escode-cli-core-api = { path = "../escode-cli-rust/crates/core-api" }
escode-cli-host = { path = "../escode-cli-rust/crates/host" }
escode-cli-net = { path = "../escode-cli-rust/crates/net" }
# tasks-index（TS `node:sqlite` 同库互操作）：与 CLI 侧同一 rusqlite 版本与 bundled SQLite。
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
# traceId 生成（TS `generateTraceId` = `createUuid()`，UUID v4）。
uuid = { version = "1", features = ["v4", "v7"] }
# terminal 域的 pty（Unix openpty / Windows ConPTY；TS 侧对应 node-pty）。
portable-pty = "0.9"
# file-watcher 域（Linux inotify / macOS FSEvents / Windows ReadDirectoryChangesW；TS 侧对应 node:fs watch）。
notify = "8"
# file 域的 .escodeignore 规则（gitignore 语法；TS 侧对应 `ignore` npm 包）。
ignore = "0.4"
# providers 域：规则正则（JS `RegExp` 的子集）与 WHATWG URL 规范化/校验。
regex = "1"
url = "2"
escode-cli-domain = { path = "../escode-cli-rust/crates/domain" }
escode-cli-app-server = { path = "../escode-cli-rust/crates/app-server" }
escode-cli-protocol = { path = "../escode-cli-rust/crates/protocol" }
escode-cli-rust = { path = "../escode-cli-rust" }
escode-host-core = { path = "crates/host-core" }
escode-host-proto = { path = "crates/host-proto" }
escode-host-gateway = { path = "crates/host-gateway" }
escode-host-control = { path = "crates/host-control" }
escode-host-runtime = { path = "crates/host-runtime" }
escode-host-services = { path = "crates/host-services" }
escode-host-surface = { path = "crates/host-surface" }
escode-host-rpc = { path = "crates/host-rpc" }

[package]
name = "escode-host"
description = "ESCode App 级 Rust Host：一组窗口共享的 runtime 实例表与控制通路"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
escode-host-control.workspace = true
escode-host-runtime.workspace = true
escode-host-services.workspace = true
escode-host-surface.workspace = true
escode-host-rpc.workspace = true
escode-cli-rust.workspace = true
escode-cli-core-api.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
