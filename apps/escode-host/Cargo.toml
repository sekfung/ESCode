[workspace]
members = ["crates/host-core", "crates/host-proto", "crates/host-gateway", "crates/host-control"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# 与 apps/escode-cli-rust 同一份 deny 清单（docs/specs/rust-unified-host.md 阶段 0 护栏）。
[workspace.lints.clippy]
await_holding_lock = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_collect = "deny"
needless_question_mark = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
trivially_copy_pass_by_ref = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_to_owned = "deny"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tempfile = "3"
# 共享基础代码复用 CLI 侧 crate（阶段 1 库化红利；见 rust-u2-host-skeleton.md §2）。
escode-cli-core-api = { path = "../../escode-cli-rust/crates/core-api" }
escode-cli-host = { path = "../../escode-cli-rust/crates/host" }
escode-cli-app-server = { path = "../../escode-cli-rust/crates/app-server" }
escode-cli-protocol = { path = "../../escode-cli-rust/crates/protocol" }
escode-host-core = { path = "crates/host-core" }
escode-host-proto = { path = "crates/host-proto" }
escode-host-gateway = { path = "crates/host-gateway" }
escode-host-control = { path = "crates/host-control" }
